<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rich Clicker</title>
    <!-- Правильный скрипт -->
    <script src="https://telegram.org"></script>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        #balance { font-size: 40px; color: gold; margin-bottom: 20px; }
        #click-btn { width: 200px; height: 200px; background: orange; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 80px; cursor: pointer; border: 5px solid #333; }
        #debug { position: fixed; bottom: 10px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

    <div id="balance">$ <span id="score">0</span></div>
    <div id="click-btn">💰</div>
    <div id="debug">Проверка SDK...</div>

    <script>
        // Инициализация
        const tg = window.Telegram.WebApp;
        const scoreEl = document.getElementById('score');
        const btnEl = document.getElementById('click-btn');
        const debug = document.getElementById('debug');

        let score = 0;

        // Сообщаем Telegram, что приложение готово
        tg.ready();
        tg.expand();

        // Сразу настраиваем и показываем главную кнопку ТГ
        tg.MainButton.text = "СОХРАНИТЬ В БАЗУ";
        tg.MainButton.color = "#2ecc71"; // Зеленый цвет
        tg.MainButton.show(); 

        // Клик по мешку
        btnEl.onclick = () => {
            score += 100000;
            scoreEl.innerText = score.toLocaleString();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            debug.innerText = "Кликов: " + score;
        };

        // Клик по кнопке Telegram (внизу экрана)
        tg.onEvent('mainButtonClicked', () => {
            debug.innerText = "Отправка данных...";
            // Отправляем данные боту (работает ТОЛЬКО через ReplyKeyboard)
            tg.sendData(score.toString()); 
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rich Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        #balance-container {
            font-size: 45px;
            font-weight: 900;
            color: #ffcc00;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        #energy-container {
            font-size: 22px;
            font-weight: bold;
            color: #ffaa00;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 15px;
            border-radius: 20px;
        }
        #click-btn {
            width: 240px;
            height: 240px;
            background: linear-gradient(145deg, #ffa500, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            cursor: pointer;
            border: 8px solid #333;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.3);
            transition: transform 0.05s, opacity 0.3s;
            position: relative;
            user-select: none;
            touch-action: manipulation;
        }
        #click-btn:active {
            transform: scale(0.92);
        }
        #click-btn.disabled {
            opacity: 0.4;
            filter: grayscale(0.8);
            cursor: not-allowed;
        }
        #cooldown-timer {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 15px;
            display: none;
        }
        .popup {
            position: absolute;
            color: #4df14d;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            animation: moveUp 0.8s forwards;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-160px); opacity: 0; }
        }
        #info-text {
            position: fixed;
            bottom: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
            left: 0;
            right: 0;
        }
        #save-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 300px;
            padding: 15px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #save-btn:active {
            transform: translateX(-50%) scale(0.97);
        }
        .toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #4df14d;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 101;
            animation: fadeOut 2s forwards;
            white-space: nowrap;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    <div id="balance-container">💰 $<span id="balance">0</span></div>
    <div id="energy-container">⚡ <span id="energy">500</span> / 500</div>
    
    <div id="click-btn">
        💰
        <div id="cooldown-timer">03:00</div>
    </div>
    <div id="info-text">💰 За 500 энергии вы получите 1,000,000,000$</div>
    <button id="save-btn">💾 СОХРАНИТЬ И ЗАЧИСЛИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const btnEl = document.getElementById('click-btn');
        const timerEl = document.getElementById('cooldown-timer');
        const saveBtn = document.getElementById('save-btn');
        
        let score = 0;
        let energy = 500;
        let cooldownEnd = null;
        
        let isCooldown = false;
        let cooldownInterval = null;
        const maxEnergy = 500;
        const clickReward = 2000000;
        
        function loadData() {
            let savedScore = localStorage.getItem('clicker_score');
            let savedEnergy = localStorage.getItem('clicker_energy');
            let savedCooldown = localStorage.getItem('cooldown_end');
            
            if (savedScore) score = parseInt(savedScore);
            if (savedEnergy) energy = parseInt(savedEnergy);
            if (savedCooldown) cooldownEnd = savedCooldown;
            
            balanceEl.innerText = score.toLocaleString();
            energyEl.innerText = energy;
        }
        
        function saveData() {
            localStorage.setItem('clicker_score', score);
            localStorage.setItem('clicker_energy', energy);
            if (cooldownEnd) localStorage.setItem('cooldown_end', cooldownEnd);
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function showSaveButton() {
            saveBtn.style.display = score > 0 ? 'block' : 'none';
        }
        
        function checkCooldown() {
            if (cooldownEnd) {
                const now = Date.now();
                const remaining = Math.ceil((parseInt(cooldownEnd) - now) / 1000);
                if (remaining > 0) {
                    startCooldown(remaining);
                } else {
                    resetEnergy();
                }
            } else if (energy <= 0) {
                startCooldown(180);
            }
        }
        
        function startCooldown(seconds) {
            isCooldown = true;
            btnEl.classList.add('disabled');
            timerEl.style.display = 'block';
            
            if (!cooldownEnd) {
                cooldownEnd = Date.now() + (seconds * 1000);
                saveData();
            }
            
            if (cooldownInterval) clearInterval(cooldownInterval);
            
            cooldownInterval = setInterval(() => {
                const now = Date.now();
                const timeLeft = Math.ceil((parseInt(cooldownEnd) - now) / 1000);
                if (timeLeft <= 0) {
                    clearInterval(cooldownInterval);
                    cooldownInterval = null;
                    resetEnergy();
                } else {
                    let mins = Math.floor(timeLeft / 60);
                    let secs = timeLeft % 60;
                    timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 1000);
        }
        
        function resetEnergy() {
            energy = maxEnergy;
            isCooldown = false;
            cooldownEnd = null;
            localStorage.removeItem('cooldown_end');
            saveData();
            btnEl.classList.remove('disabled');
            timerEl.style.display = 'none';
            energyEl.innerText = energy;
            if (cooldownInterval) {
                clearInterval(cooldownInterval);
                cooldownInterval = null;
            }
            showToast('⚡ Энергия восстановлена!');
        }
        
        function sendDataToBot() {
            if (score > 0) {
                showToast(`📤 Отправка ${score.toLocaleString()}$...`);
                
                if (tg) {
                    tg.sendData(score.toString());
                    tg.close();
                } else {
                    showToast('❌ Ошибка: не в Telegram');
                }
                
                score = 0;
                saveData();
                balanceEl.innerText = "0";
                saveBtn.style.display = 'none';
            } else {
                showToast('❌ Нет денег для сохранения');
            }
        }
        
        function clickHandler(e) {
            if (isCooldown) {
                showToast('⏳ Подождите, энергия восстанавливается');
                return;
            }
            if (energy <= 0) {
                showToast('⚡ Нет энергии! Подождите 3 минуты');
                return;
            }
            
            score += clickReward;
            energy -= 1;
            
            balanceEl.innerText = score.toLocaleString();
            energyEl.innerText = energy;
            
            saveData();
            
            let x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.innerText = `+$${clickReward.toLocaleString()}`;
            popup.style.left = (x - 60) + 'px';
            popup.style.top = (y - 20) + 'px';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
            
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            
            showSaveButton();
            
            if (energy <= 0) {
                startCooldown(180);
                showToast('⚡ Энергия закончилась! Отдых 3 минуты');
            }
        }
        
        if (tg) {
            tg.expand();
            tg.ready();
            tg.MainButton.hide();
            
            tg.onEvent('mainButtonClicked', function() {
                sendDataToBot();
            });
        }
        
        loadData();
        checkCooldown();
        showSaveButton();
        
        btnEl.addEventListener('click', clickHandler);
        btnEl.addEventListener('touchstart', clickHandler, { passive: false });
        saveBtn.addEventListener('click', sendDataToBot);
        
        window.addEventListener('beforeunload', function() {
            saveData();
        });
    </script>
</body>
</html>

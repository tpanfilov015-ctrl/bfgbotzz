<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rich Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        #balance-container {
            font-size: 45px;
            font-weight: 900;
            color: #ffcc00;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        #energy-container {
            font-size: 22px;
            font-weight: bold;
            color: #ffaa00;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 15px;
            border-radius: 20px;
        }
        #click-btn {
            width: 240px;
            height: 240px;
            background: linear-gradient(145deg, #ffa500, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            cursor: pointer;
            border: 8px solid #333;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.3);
            transition: transform 0.05s;
            user-select: none;
            touch-action: manipulation;
        }
        #click-btn:active {
            transform: scale(0.92);
        }
        #click-btn.disabled {
            opacity: 0.4;
            filter: grayscale(0.8);
            cursor: not-allowed;
        }
        #cooldown-timer {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 15px;
            display: none;
        }
        .popup {
            position: absolute;
            color: #4df14d;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            animation: moveUp 0.8s forwards;
        }
        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-160px); opacity: 0; }
        }
        #info-text {
            position: fixed;
            bottom: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
            left: 0;
            right: 0;
        }
        #save-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 300px;
            padding: 15px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #save-btn:active {
            transform: translateX(-50%) scale(0.97);
        }
    </style>
</head>
<body>
    <div id="balance-container">💰 $<span id="balance">0</span></div>
    <div id="energy-container">⚡ <span id="energy">500</span> / 500</div>
    
    <div id="click-btn">
        💰
        <div id="cooldown-timer">03:00</div>
    </div>
    <div id="info-text">💰 За 500 энергии вы получите 1,000,000,000$</div>
    <button id="save-btn">💾 СОХРАНИТЬ И ЗАЧИСЛИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        
        let score = 0;
        let energy = 500;
        let cooldownEnd = null;
        let isCooldown = false;
        let cooldownInterval = null;
        
        const clickReward = 2000000;
        const maxEnergy = 500;
        
        function updateUI() {
            document.getElementById('balance').innerText = score.toLocaleString();
            document.getElementById('energy').innerText = energy;
        }
        
        function save() {
            localStorage.setItem('score', score);
            localStorage.setItem('energy', energy);
            if (cooldownEnd) localStorage.setItem('cooldownEnd', cooldownEnd);
        }
        
        function load() {
            let s = localStorage.getItem('score');
            let e = localStorage.getItem('energy');
            let c = localStorage.getItem('cooldownEnd');
            if (s) score = parseInt(s);
            if (e) energy = parseInt(e);
            if (c) cooldownEnd = c;
            updateUI();
        }
        
        function resetEnergy() {
            energy = maxEnergy;
            isCooldown = false;
            cooldownEnd = null;
            localStorage.removeItem('cooldownEnd');
            save();
            updateUI();
            document.getElementById('click-btn').classList.remove('disabled');
            document.getElementById('cooldown-timer').style.display = 'none';
            if (cooldownInterval) clearInterval(cooldownInterval);
        }
        
        function startCooldown(seconds) {
            isCooldown = true;
            document.getElementById('click-btn').classList.add('disabled');
            document.getElementById('cooldown-timer').style.display = 'block';
            
            if (!cooldownEnd) {
                cooldownEnd = Date.now() + (seconds * 1000);
                save();
            }
            
            if (cooldownInterval) clearInterval(cooldownInterval);
            
            cooldownInterval = setInterval(() => {
                let remaining = Math.ceil((parseInt(cooldownEnd) - Date.now()) / 1000);
                if (remaining <= 0) {
                    clearInterval(cooldownInterval);
                    resetEnergy();
                } else {
                    let mins = Math.floor(remaining / 60);
                    let secs = remaining % 60;
                    document.getElementById('cooldown-timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 1000);
        }
        
        function clickHandler() {
            if (isCooldown) return;
            if (energy <= 0) {
                startCooldown(180);
                return;
            }
            
            score += clickReward;
            energy--;
            updateUI();
            save();
            
            if (energy <= 0) startCooldown(180);
        }
        
        function sendToBot() {
            if (score > 0 && tg) {
                tg.sendData(score.toString());
                score = 0;
                save();
                updateUI();
                tg.close();
            }
        }
        
        document.getElementById('click-btn').onclick = clickHandler;
        document.getElementById('click-btn').ontouchstart = clickHandler;
        document.getElementById('save-btn').onclick = sendToBot;
        
        if (tg) {
            tg.expand();
            tg.ready();
            tg.MainButton.hide();
        }
        
        load();
        if (cooldownEnd && Date.now() < parseInt(cooldownEnd)) {
            startCooldown(Math.ceil((parseInt(cooldownEnd) - Date.now()) / 1000));
        } else if (energy <= 0) {
            startCooldown(180);
        }
        
        window.onbeforeunload = function() {
            save();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rich Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #balance-container {
            font-size: 45px;
            font-weight: 900;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }
        #energy-container {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 30px;
        }
        #click-btn {
            width: 240px;
            height: 240px;
            background: linear-gradient(145deg, #ffa500, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            cursor: pointer;
            border: 8px solid #333;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.3);
            transition: transform 0.05s, opacity 0.3s;
            z-index: 10;
            position: relative;
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none;             
            -webkit-user-select: none;                
            user-select: none;                       
            touch-action: manipulation;               
            outline: none;                            
        }
        #click-btn:active {
            transform: scale(0.92);
        }
        #click-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }
        #cooldown-timer {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 10px;
            display: none;
        }
        .popup {
            position: absolute;
            color: #4df14d;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            z-index: 99;
            animation: moveUp 0.8s forwards;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-160px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="balance-container">$ <span id="balance">0</span></div>
    <div id="energy-container">Энергия: <span id="energy">500</span> / 500</div>
    
    <div id="click-btn">
        💰
        <div id="cooldown-timer">03:00</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const btnEl = document.getElementById('click-btn');
        const timerEl = document.getElementById('cooldown-timer');
        
        let score = 0;
        let energy = 500;
        const maxEnergy = 500;
        let isCooldown = false;

        if (tg) {
            tg.expand();
            tg.ready();
        }

        function startCooldown() {
            isCooldown = true;
            btnEl.classList.add('disabled');
            timerEl.style.display = 'block';
            
            let timeLeft = 180; // 3 минуты

            const interval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    energy = maxEnergy;
                    isCooldown = false;
                    btnEl.classList.remove('disabled');
                    timerEl.style.display = 'none';
                    energyEl.innerText = energy;
                }
            }, 1000);
        }

        function clickHandler(e) {
            if (isCooldown) return;

            if (energy <= 0) {
                startCooldown();
                return;
            }

            // Логика клика
            score += 100000;
            energy -= 1;
            
            balanceEl.innerText = score.toLocaleString();
            energyEl.innerText = energy;

            // Анимация +100к
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const p = document.createElement('div');
            p.className = 'popup';
            p.innerText = '+$100,000';
            p.style.left = (clientX - 60) + 'px';
            p.style.top = (clientY - 20) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);

            if (tg) {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                tg.MainButton.text = "СОХРАНИТЬ";
                tg.MainButton.show();
            }

            if (energy <= 0) startCooldown();
        }

        btnEl.addEventListener('pointerdown', clickHandler);

        if (tg) {
            tg.onEvent('mainButtonClicked', function() {
                tg.sendData(score.toString());
                tg.close();
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            color: gold;
            margin-bottom: 10px;
        }
        .energy {
            font-size: 24px;
            color: orange;
            margin-bottom: 30px;
        }
        .coin {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff9900);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.05s linear;
            border: 5px solid #ffaa00;
        }
        .coin:active {
            transform: scale(0.95);
        }
        .coin.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .timer {
            margin-top: 30px;
            font-size: 20px;
            color: red;
            display: none;
        }
        .save-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            width: 80%;
            max-width: 300px;
        }
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            animation: fade 2s forwards;
        }
        @keyframes fade {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</head>
<body>
    <div class="balance">💰 $<span id="balance">0</span></div>
    <div class="energy">⚡ <span id="energy">500</span> / 500</div>
    <div class="coin" id="coin">💰</div>
    <div class="timer" id="timer">03:00</div>
    <button class="save-btn" id="saveBtn">💾 СОХРАНИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        
        let money = 0;
        let energy = 500;
        let cooldownUntil = null;
        let timerInterval = null;
        
        const MAX_ENERGY = 500;
        const PER_CLICK = 2000000;
        
        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const coinEl = document.getElementById('coin');
        const timerEl = document.getElementById('timer');
        const saveBtn = document.getElementById('saveBtn');
        
        function saveToLocal() {
            localStorage.setItem('clicker_money', money);
            localStorage.setItem('clicker_energy', energy);
            if (cooldownUntil) localStorage.setItem('clicker_cooldown', cooldownUntil);
        }
        
        function loadFromLocal() {
            let m = localStorage.getItem('clicker_money');
            let e = localStorage.getItem('clicker_energy');
            let c = localStorage.getItem('clicker_cooldown');
            if (m) money = parseInt(m);
            if (e) energy = parseInt(e);
            if (c && parseInt(c) > Date.now()) cooldownUntil = parseInt(c);
            balanceEl.innerText = money.toLocaleString();
            energyEl.innerText = energy;
        }
        
        function showToast(msg, isError = false) {
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            if (isError) toast.style.background = '#dc3545';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function startCooldown(seconds) {
            if (timerInterval) clearInterval(timerInterval);
            cooldownUntil = Date.now() + (seconds * 1000);
            saveToLocal();
            coinEl.classList.add('disabled');
            timerEl.style.display = 'block';
            
            timerInterval = setInterval(() => {
                let left = Math.ceil((cooldownUntil - Date.now()) / 1000);
                if (left <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    energy = MAX_ENERGY;
                    cooldownUntil = null;
                    coinEl.classList.remove('disabled');
                    timerEl.style.display = 'none';
                    energyEl.innerText = energy;
                    saveToLocal();
                    showToast('⚡ Энергия восстановлена!');
                } else {
                    let mins = Math.floor(left / 60);
                    let secs = left % 60;
                    timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 1000);
        }
        
        function clickHandler() {
            if (cooldownUntil && cooldownUntil > Date.now()) {
                showToast('⏳ Нет энергии!', true);
                return;
            }
            if (energy <= 0) {
                startCooldown(180);
                return;
            }
            
            money += PER_CLICK;
            energy--;
            
            balanceEl.innerText = money.toLocaleString();
            energyEl.innerText = energy;
            saveToLocal();
            
            if (energy <= 0) {
                startCooldown(180);
            }
            
            if (money > 0) {
                saveBtn.style.display = 'block';
            }
            
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }
        
        function sendToBot() {
            if (money > 0 && tg) {
                tg.sendData(money.toString());
                showToast(`✅ Отправлено ${money.toLocaleString()}$`);
                money = 0;
                balanceEl.innerText = '0';
                saveBtn.style.display = 'none';
                saveToLocal();
                setTimeout(() => tg.close(), 300);
            } else {
                showToast('❌ Нет денег', true);
            }
        }
        
        coinEl.onclick = clickHandler;
        coinEl.ontouchstart = clickHandler;
        saveBtn.onclick = sendToBot;
        
        if (tg) {
            tg.expand();
            tg.ready();
            tg.MainButton.hide();
        }
        
        loadFromLocal();
        
        if (cooldownUntil && cooldownUntil > Date.now()) {
            let left = Math.ceil((cooldownUntil - Date.now()) / 1000);
            startCooldown(left);
        } else if (energy <= 0) {
            startCooldown(180);
        }
        
        if (money > 0) saveBtn.style.display = 'block';
        
        window.onbeforeunload = () => saveToLocal();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clicker 100k</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        #balance { font-size: 40px; margin-bottom: 20px; color: #f3ba2f; font-weight: bold; }
        #click-btn {
            width: 200px; height: 200px; border-radius: 50%;
            background: gold; border: 8px solid #444;
            font-size: 80px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.05s;
        }
        #click-btn:active { transform: scale(0.9); }
        .popup {
            position: absolute; color: #4df14d; font-size: 30px; font-weight: bold;
            pointer-events: none; z-index: 9999; animation: moveUp 0.8s forwards;
        }
        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-150px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="balance">0</div>
    <div id="click-btn">🪙</div>

    <script>
        const tg = window.Telegram.WebApp;
        const btn = document.getElementById('click-btn');
        const balanceDisplay = document.getElementById('balance');
        let score = 0;

        // Настройка TG
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function handleEvent(e) {
            if (e.type === 'touchstart') e.preventDefault();

            score += 100000;
            balanceDisplay.innerText = score.toLocaleString();

            // Координаты (исправлено для браузера и ТГ)
            let x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            showPopup(x, y);

            // Функции Telegram
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (tg && tg.MainButton) {
                tg.MainButton.setText("СОХРАНИТЬ");
                if (!tg.MainButton.isVisible) tg.MainButton.show();
            }
        }

        function showPopup(x, y) {
            const p = document.createElement('div');
            p.className = 'popup';
            p.innerText = '+100,000';
            p.style.left = (x - 50) + 'px';
            p.style.top = (y - 20) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        // Слушаем всё
        btn.addEventListener('touchstart', handleEvent, { passive: false });
        btn.addEventListener('mousedown', handleEvent);

        if (tg) {
            tg.onEvent('mainButtonClicked', () => {
                tg.sendData(JSON.stringify({ total: score }));
            });
        }
    </script>
</body>
</html>
